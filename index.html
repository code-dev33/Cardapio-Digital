<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio | Lanchonete do Zé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b3a;--red:#e63946;--yellow:#ffcf33;--soft:#fff3c4;--muted:#5b5b78;--green:#25d366;
--display:"Bowlby One","Arial Black",Impact,sans-serif;--body:"Nunito","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);line-height:1.45;background:#fffaf0 radial-gradient(rgba(27,27,58,.09) 2px,transparent 2px) 0 0/24px 24px}
button{font:inherit;cursor:pointer;color:inherit}
header{position:relative;overflow:hidden;background:var(--yellow);padding:52px 20px 60px;text-align:center;border-bottom:6px solid var(--ink);border-radius:0 0 50% 50%/0 0 36px 36px}
header::before{content:"";position:absolute;inset:-40% -10% auto auto;width:360px;height:360px;border-radius:50%;background:#ffe27a;opacity:.7}
.em{position:absolute;font-size:2.4rem;filter:drop-shadow(2px 3px 0 rgba(27,27,58,.25));animation:float 4s ease-in-out infinite}
.e1{left:6%;top:18%;--r:-15deg}.e2{right:7%;top:12%;--r:14deg;animation-delay:-1s}.e3{left:12%;bottom:14%;--r:10deg;animation-delay:-2s}.e4{right:10%;bottom:16%;--r:-10deg;animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
.burger{position:relative;font-size:4.2rem;display:block;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1}
h1 span{display:block;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
header p{position:relative;margin:14px auto 0;max-width:420px;font-weight:700}
.open{position:relative;display:inline-block;margin-top:14px;background:var(--ink);color:var(--yellow);font-weight:800;padding:6px 18px;border-radius:99px;transform:rotate(-2deg)}
.open.closed{background:var(--red);color:#fff}

.bar{position:sticky;top:0;z-index:5;background:var(--ink);padding:10px 12px;box-shadow:0 4px 0 var(--red)}
.search{display:block;width:100%;max-width:860px;margin:0 auto 8px;padding:10px 16px;border-radius:99px;border:3px solid var(--yellow);background:#fff;font:inherit;color:var(--ink)}
.search:focus{outline:3px solid #fff}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:860px;margin:0 auto;padding-bottom:2px}
.chip{flex:0 0 auto;background:transparent;border:2px solid transparent;color:#fff;font-weight:800;padding:6px 15px;border-radius:99px;transition:.15s}
.chip:hover{border-color:var(--yellow)}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}

main{max-width:860px;margin:0 auto;padding:6px 18px 130px}
section{padding-top:30px}
h2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:1.8rem;margin-bottom:16px}
h2 i{font-style:normal;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--red);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:1.7rem;transform:rotate(-6deg)}
ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
li{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
li:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--red)}
.ic{font-size:2.4rem;width:58px;height:58px;display:grid;place-items:center;background:var(--soft);border-radius:50%}
li b{font-size:1.08rem;font-weight:800;line-height:1.2;display:block}
li em{font-style:normal;color:var(--muted);font-size:.93rem;display:block}
.row{display:flex;align-items:center;gap:10px;margin-top:8px}
.p{background:var(--red);color:#fff;font-family:var(--display);font-size:.95rem;padding:2px 12px;border-radius:99px;border:2px solid var(--ink)}
.add{margin-left:auto;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;font-weight:800;padding:4px 14px;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.add:hover{background:#ffdb66}.add:active{transform:translate(2px,2px);box-shadow:none}
.add.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.qty{position:absolute;top:-10px;left:-10px;background:var(--green);border:3px solid var(--ink);border-radius:99px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;font-size:.85rem;padding:0 6px}
.qty[hidden]{display:none}
li.hot{background:var(--soft);border-color:var(--red);box-shadow:4px 4px 0 var(--red)}
li.hot::after{content:"⭐ O mais pedido";position:absolute;top:-13px;right:14px;background:var(--ink);color:var(--yellow);font-size:.75rem;font-weight:800;padding:2px 12px;border-radius:99px}
.none{text-align:center;padding:50px 10px;font-weight:700;color:var(--muted)}

.cart{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:6;width:min(560px,calc(100% - 28px));display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--green);border:3px solid var(--ink);border-radius:99px;padding:12px 22px;font-weight:800;box-shadow:4px 4px 0 var(--ink);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.cart.show{transform:translate(-50%,0)}

dialog{margin:auto;width:min(560px,calc(100% - 24px));max-height:88vh;border:3px solid var(--ink);border-radius:20px;padding:0;background:#fffaf0;color:var(--ink);box-shadow:8px 8px 0 var(--red);overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .35s both}
dialog::backdrop{background:rgba(27,27,58,.7)}
.dh{display:flex;justify-content:space-between;align-items:center;background:var(--yellow);padding:14px 18px;border-bottom:3px solid var(--ink)}
.dh h3{font-family:var(--display);font-weight:400;font-size:1.4rem}
.x{background:var(--ink);color:#fff;border:0;border-radius:50%;width:36px;height:36px}
.db{padding:14px 18px;overflow-y:auto}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dotted #c9c9d6}
.it span:first-child{flex:1;font-weight:700}
.st{display:flex;align-items:center;gap:8px}
.st button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800}
.st button:hover{background:var(--yellow)}
.sub{min-width:76px;text-align:right;font-weight:800}
textarea{width:100%;margin-top:14px;border:3px solid var(--ink);border-radius:12px;padding:10px;font:inherit;resize:vertical;min-height:70px}
.df{padding:14px 18px;border-top:3px solid var(--ink);background:#fff}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.2rem;margin-bottom:12px}
.send{display:block;width:100%;text-align:center;text-decoration:none;background:var(--green);color:var(--ink);font-weight:800;padding:13px;border-radius:99px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.send:hover{background:#3be07d}
.clear{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:0 20px 100px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:520px){.em{font-size:1.8rem}.burger{font-size:3.4rem}ul{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <span class="em e1" aria-hidden="true">🍟</span><span class="em e2" aria-hidden="true">🥤</span>
  <span class="em e3" aria-hidden="true">🌭</span><span class="em e4" aria-hidden="true">🧀</span>
  <span class="burger" aria-hidden="true">🍔</span>
  <h1>Lanchonete <span>do Zé</span></h1>
  <p>Lanche quentinho, feito na hora e com muito sabor.</p>
  <span class="open" id="open">Aberto todos os dias, das 17h às 23h</span>
</header>

<div class="bar">
  <input class="search" id="q" type="search" placeholder="🔎 Buscar lanche..." aria-label="Buscar lanche">
  <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
</div>

<main id="menu"></main>
<footer>Preços e itens sujeitos a alteração. Lanchonete do Zé.</footer>

<button class="cart" id="cart" type="button"></button>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h3 id="dt">🛒 Seu pedido</h3><button class="x" id="close" type="button" aria-label="Fechar">✕</button></div>
  <div class="db"><div id="list"></div>
    <textarea id="obs" placeholder="Observações (ex.: sem cebola, endereço de entrega)"></textarea></div>
  <div class="df">
    <div class="tot"><span>Total</span><span id="total"></span></div>
    <a class="send" id="send" href="#" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
    <button class="clear" id="clear" type="button">Limpar pedido</button>
  </div>
</dialog>

<script>
// ====== EDITE AQUI ======
const WHATSAPP = "5500000000000";          // país + DDD + número
const HORARIO = { abre: 17, fecha: 23 };   // horas (formato 24h)
const MENU = [
  { id:"hamburgueres", nome:"Hambúrgueres", emoji:"🍔", itens:[
    ["X-Burger","Pão, hambúrguer e queijo",14,"🍔"],
    ["X-Salada","Hambúrguer, queijo, alface e tomate",16,"🥬"],
    ["X-Bacon","Hambúrguer, queijo e bacon crocante",20,"🥓"],
    ["X-Tudo","Hambúrguer, queijo, bacon, ovo, presunto, alface e tomate",24,"🔥",1],
    ["Artesanal da Casa","180 g de carne, cheddar, cebola caramelizada e molho especial",28,"🧀"] ]},
  { id:"sanduiches", nome:"Sanduíches", emoji:"🥪", itens:[
    ["Misto Quente","Presunto e queijo na chapa",8,"🥪"],
    ["Bauru","Rosbife, queijo derretido, tomate e pepino",18,"🥩"],
    ["Americano","Presunto, queijo, ovo, alface e tomate",15,"🍳"],
    ["Hot Dog Completo","Duas salsichas, purê, vinagrete, milho e batata palha",14,"🌭"] ]},
  { id:"salgados", nome:"Salgados", emoji:"🥟", itens:[
    ["Coxinha","Frango com catupiry",7,"🍗"],
    ["Pastel","Carne, queijo ou frango",8,"🥟"],
    ["Pão de Queijo","Porção com 6 unidades",9,"🧆"],
    ["Empada","Frango ou palmito",6,"🥧"] ]},
  { id:"porcoes", nome:"Porções", emoji:"🍟", itens:[
    ["Batata Frita","Porção para dividir",18,"🍟"],
    ["Batata com Cheddar e Bacon","Porção para dividir",26,"🧀"],
    ["Mandioca Frita","Porção para dividir",20,"🥔"] ]},
  { id:"bebidas", nome:"Bebidas", emoji:"🥤", itens:[
    ["Suco Natural","Laranja, acerola, maracujá ou abacaxi com hortelã",9,"🍊"],
    ["Refrigerante Lata","350 ml",6,"🥤"],
    ["Refrigerante 2 L","Para a mesa toda",12,"🍾"],
    ["Água","Com ou sem gás",4,"💧"],
    ["Café","Coado na hora",4,"☕"] ]}
];
// ========================

const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const price = {}; MENU.forEach(c => c.itens.forEach(i => price[i[0]] = i[2]));
let cart = {}, filtro = "todos";
try { cart = JSON.parse(localStorage.getItem("cart-ze") || "{}"); } catch(e) {}
Object.keys(cart).forEach(k => { if (!price[k]) delete cart[k]; });
const save = () => { try { localStorage.setItem("cart-ze", JSON.stringify(cart)); } catch(e) {} };

// aberto / fechado
(function(){
  const h = new Date().getHours(), el = $("#open");
  if (h < HORARIO.abre || h >= HORARIO.fecha) { el.textContent = "Fechado agora. Abrimos às " + HORARIO.abre + "h"; el.classList.add("closed"); }
})();

// chips
const chips = $("#chips");
[{id:"todos",nome:"Todos",emoji:"✨"}, ...MENU].forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.dataset.id = c.id;
  b.textContent = c.emoji + " " + c.nome;
  b.setAttribute("aria-pressed", c.id === filtro);
  b.onclick = () => { filtro = c.id; chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
  chips.append(b);
});

// cardápio
function render() {
  const q = $("#q").value.trim().toLowerCase(), menu = $("#menu");
  menu.textContent = ""; let n = 0, d = 0;
  MENU.forEach(c => {
    if (filtro !== "todos" && filtro !== c.id) return;
    const itens = c.itens.filter(i => !q || (i[0] + " " + i[1]).toLowerCase().includes(q));
    if (!itens.length) return;
    const sec = document.createElement("section");
    sec.innerHTML = `<h2><i>${c.emoji}</i>${c.nome}</h2><ul></ul>`;
    itens.forEach(i => {
      n++;
      const li = document.createElement("li");
      if (i[4]) li.className = "hot";
      li.style.animationDelay = Math.min(d++ * 40, 400) + "ms";
      li.innerHTML = `<span class="qty" hidden></span><span class="ic">${i[3]}</span>
        <div><b></b><em></em><div class="row"><span class="p">${brl(i[2])}</span><button class="add" type="button">+ Adicionar</button></div></div>`;
      li.querySelector("b").textContent = i[0];
      li.querySelector("em").textContent = i[1];
      li.dataset.nome = i[0];
      const btn = li.querySelector(".add");
      btn.setAttribute("aria-label", "Adicionar " + i[0] + " ao pedido");
      btn.onclick = () => { mudar(i[0], 1); btn.classList.remove("bump"); void btn.offsetWidth; btn.classList.add("bump"); };
      sec.querySelector("ul").append(li);
    });
    menu.append(sec);
  });
  if (!n) menu.innerHTML = '<p class="none">😕 Nenhum lanche encontrado. Tente outra palavra.</p>';
  badges();
}
function badges() {
  document.querySelectorAll("li[data-nome]").forEach(li => {
    const q = cart[li.dataset.nome] || 0, el = li.querySelector(".qty");
    el.hidden = !q; el.textContent = q + "x";
  });
}

// pedido
function mudar(nome, delta) {
  cart[nome] = (cart[nome] || 0) + delta;
  if (cart[nome] <= 0) delete cart[nome];
  save(); badges(); atualizar();
}
function atualizar() {
  const nomes = Object.keys(cart);
  const qtd = nomes.reduce((s, k) => s + cart[k], 0);
  const total = nomes.reduce((s, k) => s + cart[k] * price[k], 0);
  const bar = $("#cart");
  bar.classList.toggle("show", qtd > 0);
  bar.innerHTML = `<span>🛒 ${qtd} ${qtd === 1 ? "item" : "itens"}</span><span>${brl(total)}</span><span>Ver pedido</span>`;
  const list = $("#list"); list.textContent = "";
  nomes.forEach(k => {
    const r = document.createElement("div"); r.className = "it";
    r.innerHTML = `<span></span><span class="st"><button type="button" aria-label="Diminuir">−</button><b>${cart[k]}</b><button type="button" aria-label="Aumentar">+</button></span><span class="sub">${brl(cart[k] * price[k])}</span>`;
    r.firstChild.textContent = k;
    const [menos, mais] = r.querySelectorAll("button");
    menos.onclick = () => mudar(k, -1); mais.onclick = () => mudar(k, 1);
    list.append(r);
  });
  $("#total").textContent = brl(total);
  if (!qtd && $("#dlg").open) $("#dlg").close();
  link();
}
function link() {
  let t = "Olá! Quero fazer um pedido:\n\n";
  Object.keys(cart).forEach(k => t += `${cart[k]}x ${k} - ${brl(cart[k] * price[k])}\n`);
  t += "\nTotal: " + brl(Object.keys(cart).reduce((s, k) => s + cart[k] * price[k], 0));
  const o = $("#obs").value.trim(); if (o) t += "\nObs.: " + o;
  $("#send").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(t);
}

$("#q").addEventListener("input", render);
$("#obs").addEventListener("input", link);
$("#cart").onclick = () => $("#dlg").showModal();
$("#close").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$("#clear").onclick = () => { cart = {}; save(); badges(); atualizar(); };

render(); atualizar();
</script>
</body>
</html>
